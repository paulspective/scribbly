<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scribbly</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="./assets/favicons/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicons/apple-touch-icon-180x180.png">
  <meta name="apple-mobile-web-app-title" content="Scribbly">
  <link rel="manifest" href="manifest.json">
</head>
<body data-theme="dark">

  <div class="note-container">
    <header>
      <h1>Scribbly</h1>
      <div class="header-actions">
        <div class="theme-btn" title="Toggle theme">
          <img src="./assets/icons/contrast.svg" alt="Toggle theme">
        </div>
        <div class="add-btn" title="Add note">
          <img src="./assets/icons/add.svg" alt="Add note">
        </div>
      </div>
    </header>

    <input type="text" class="search" placeholder="Search...">
    <div class="notes"></div>

    <div class="empty">No notes yet. Start scribbling.</div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
