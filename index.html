<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scribbly</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" id="theme-color-meta" content="#f0f2f5">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicons/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <iconify-icon icon="fluent:apps-add-in-24-filled" width="24"></iconify-icon>
        <span class="text">Dashboard</span>
      </div>

      <div class="add-section">
        <button id="btn-add-note" class="add-btn">
          <iconify-icon icon="fluent:note-add-24-filled" width="20"></iconify-icon> Add new
        </button>
      </div>

      <nav class="nav-menu">
        <a href="#" id="nav-all" class="active">
          <iconify-icon icon="fluent:archive-24-regular" width="20"></iconify-icon> All Notes
        </a>
        <a href="#" id="nav-trash">
          <iconify-icon icon="fluent:delete-24-regular" width="20"></iconify-icon> Recently Deleted
        </a>
        <div class="nav-account-wrap" id="nav-account-wrap">
          <a href="#" id="nav-account">
            <iconify-icon icon="fluent:person-24-regular" width="20"></iconify-icon> <span id="nav-account-label">Log
              in</span>
            <iconify-icon id="nav-account-caret" class="account-caret" icon="fluent:chevron-down-24-regular"
              width="14"></iconify-icon>
          </a>
          <div class="account-dropdown" id="account-dropdown">
            <button type="button" id="btn-logout" class="dropdown-item">
              <iconify-icon icon="fluent:sign-out-24-regular" width="20"></iconify-icon> Log out
            </button>
          </div>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="top-header-row">
          <button class="hamburger-btn" id="hamburger-btn">
            <iconify-icon icon="fluent:navigation-24-regular" width="24"></iconify-icon>
          </button>
          <h1 class="app-title">Scribbly</h1>
        </div>
        <div class="search-box">
          <iconify-icon icon="fluent:search-24-regular" width="20"></iconify-icon>
          <input type="text" id="search-input" placeholder="Search">
        </div>
      </header>

      <section class="notes-section">
        <div class="notes-header-bar">
          <div class="tabs">
            <span class="tab active" data-tab="today">Todays</span>
            <span class="tab" data-tab="week">This Week</span>
            <span class="tab" data-tab="month">This Month</span>
            <span class="tab-indicator" id="tab-indicator"></span>
          </div>
          <div class="date-nav">
            <iconify-icon id="month-prev" icon="fluent:caret-left-24-filled"></iconify-icon>
            <span id="current-month-display"></span>
            <iconify-icon id="month-next" icon="fluent:caret-right-24-filled"></iconify-icon>
          </div>
        </div>

        <div class="notes-grid" id="notes-grid">
        </div>
      </section>
    </main>
  </div>

  <button id="fab-add-note" class="fab" aria-label="Add new note">
    <iconify-icon icon="fluent:add-24-filled" width="26"></iconify-icon>
  </button>

  <div class="modal" id="note-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal"><iconify-icon icon="fluent:dismiss-24-regular"></iconify-icon></span>
      <input type="text" id="note-title" placeholder="Give it a title">
      <textarea id="note-body" placeholder="Start scribbling..."></textarea>
      <div class="color-palette">
        <span class="dot" data-color="#eada76" style="background-color: #eada76;"></span>
        <span class="dot" data-color="#7bb2db" style="background-color: #7bb2db;"></span>
        <span class="dot" data-color="#f28b82" style="background-color: #f28b82;"></span>
        <span class="dot" data-color="#a7ffeb" style="background-color: #a7ffeb;"></span>
        <span class="dot" data-color="#c9a9e0" style="background-color: #c9a9e0"></span>
      </div>
      <button id="save-note-btn">Done</button>
    </div>
  </div>

  <div class="modal" id="auth-modal">
    <div class="modal-content auth-modal-content">
      <span class="close-btn" id="close-auth-modal"><iconify-icon
          icon="fluent:dismiss-24-regular"></iconify-icon></span>

      <div class="auth-tabs">
        <span class="auth-tab active" data-auth-tab="login">Log in</span>
        <span class="auth-tab" data-auth-tab="signup">Sign up</span>
      </div>

      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required>
        <div class="password-field" id="auth-password-wrapper">
          <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required>
          <span class="toggle-password" id="toggle-auth-password">Show</span>
        </div>
        <p class="auth-error" id="auth-error"></p>
        <button type="submit" id="auth-submit-btn">Log in</button>
      </form>

      <p class="auth-switch-text">
        <span id="auth-switch-msg">Don't have an account?</span>
        <a href="#" id="auth-switch-link">Sign up</a>
      </p>

      <p class="auth-guest-text">
        <a href="#" id="auth-guest-link">Continue as guest</a>
      </p>
    </div>
  </div>

  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script type="module" src="scripts/main.js"></script>
</body>
</html>
